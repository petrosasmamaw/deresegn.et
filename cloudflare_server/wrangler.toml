name = "deresegn-api"
main = "src/index.js"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
minify = true

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8df800a8100447b68015d2be8463bd77"

[vars]
NODE_ENV = "production"
CLOUDINARY_FOLDER = "deresegn"
TELEBIRR_PREFER_PETROS = "true"
TELEBIRR_SKIP_DIRECT = "true"
PETROS_VERIFIER_RETRIES = "1"
PETROS_VERIFIER_TIMEOUT_MS = "12000"
